# AutoEq — one-command launch
#
#   docker compose up --build
#
# Builds from the current directory (whatever fork or branch you have checked
# out), installs everything, generates the measurement database (~250 MB), and
# builds the React frontend.  The container serves the API + frontend on a
# single port.
#
# The named volume "autoeq_data" keeps the generated measurement data across
# rebuilds — drop it with "docker compose down -v" to force a full regeneration.

services:
  autoeq:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - autoeq_data:/app/webapp/data
    restart: unless-stopped

volumes:
  autoeq_data:
